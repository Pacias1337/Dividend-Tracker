name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: node --check app.js && node --check server.js
      - run: npm test
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: git diff --exit-code -- app.css
